kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: sample-build
  creationTimestamp:
spec:
  triggers:
  - type: imageChange
    imageChange: {}
  source:
    type: Git
    git:
      uri: https://github.com/openshift/ruby-hello-world.git
      httpProxy: 127.0.0.1:3128
      httpsProxy: 127.0.0.1:3128
  strategy:
    type: Source
    sourceStrategy:
      env:
      - name: HTTPS_PROXY
        value: 127.0.0.1:3128
      - name: HTTP_PROXY
        value: 127.0.0.1:3128
      - name: "BUILD_LOGLEVEL"
        value: "2"
      from:
        kind: DockerImage
        name: quay.io/redhat-developer/test-build-simples2i:1.2
  output:
    to:
      kind: ImageStreamTag
      name: sample-build:latest
