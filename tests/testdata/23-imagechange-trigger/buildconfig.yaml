kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: sample-verbose-build
  creationTimestamp:
spec:
  triggers:
  - type: imageChange
    imageChange: {}
  source:
    type: Git
    git:
      uri: https://github.com/openshift/ruby-hello-world.git
  strategy:
    type: Source
    sourceStrategy:
      env:
      - name: FOO
        value: test
      - name: BAR
        value: test
      - name: BUILD_LOGLEVEL
        value: '5'
      from:
        kind: DockerImage
        name: image-registry.openshift-image-registry.svc:5000/openshift/ruby:3.3-ubi8
  resources: {}
  output:
    to:
      kind: ImageStreamTag
      name: sample-verbose-build:latest
status:
  lastVersion: 0
