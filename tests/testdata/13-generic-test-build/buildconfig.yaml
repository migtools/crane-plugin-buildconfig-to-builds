kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: sample-build
  creationTimestamp:
spec:
  triggers:
  - type: ImageChange
    imageChange: {}
  - type: Generic
    generic:
      secret: "mysecret"
      secretReference:
        name: "webhooksecret"
  source:
    type: Git
    git:
      uri: https://github.com/openshift/ruby-hello-world.git
  strategy:
    type: Source
    sourceStrategy:
      env:
      - name: FOO
        value: test
      - name: BAR
        value: test
      - name: BUILD_LOGLEVEL
        value: '5'
      from:
        kind: DockerImage
        name: image-registry.openshift-image-registry.svc:5000/openshift/ruby:3.3-ubi8
  resources: {}
  output:
    to:
      kind: ImageStreamTag
      name: sample-build:latest
status:
  lastVersion: 0
